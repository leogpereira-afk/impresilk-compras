# Publica no GitHub Pages a cada push na main. App vanilla: sem build — a raiz
# do repo É o site. Navegação por hash (#/rota): não precisa de 404.html.
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Dependências de teste
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verificar antes de publicar
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          node scripts/conferir-rotas.mjs
          node scripts/conferir-seletores.mjs
          node tests/prazos.mjs
          node tests/integracao.mjs
          node tests/rede.mjs
          node tests/produtos-transporte.mjs
          node tests/sintaxe-servidor.mjs
          node tests/compras-auditoria.mjs
          node tests/backend-auditoria.mjs
          node tests/experiencia-ui.mjs
          node tests/salvamento-experiencia.mjs
          node tests/acervo-auditoria.mjs
          node tests/cotacao-saldo.mjs
          node tests/pdf-auditoria.mjs
      - name: Separar arquivos públicos
        run: |
          mkdir _site
          cp index.html *.js *.css favicon.svg manifest.webmanifest _site/
          cp -R icons libs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
